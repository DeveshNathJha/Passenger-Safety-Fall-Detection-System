name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Training smoke test
        run: python src/train.py --dry-run

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fall-detection-api .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 fall-detection-api
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health | grep -q healthy
          curl -sf -X POST http://localhost:8000/predict/window \
            -H 'Content-Type: application/json' \
            -d "{\"mode\":\"human\",\"window\":$(python3 -c 'print([[0,9.81,0,0,0,0]]*128)')}"
          docker logs api
